[project]
name = "loto-worker"
version = "0.1.0"
description = "Worker Mistral Workflows pour lotagent (proposition de grilles FDJ)"
requires-python = ">=3.12"
dependencies = [
    "mistralai>=3.6.0",
    "mistralai-workflows[mistralai]>=3.17.1",
    "pydantic>=2.14",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
